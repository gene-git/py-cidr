[project]
name = "py-cidr"
version = "5.0.2"
description = "Python module providing network / CIDR tools"
authors = [{ name = "Gene C", email = "arch@sapience.com" }]
license = "GPL-2.0-or-later"
readme = "README.rst"
keywords = []
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[build-system]
requires = ["meson-python", "cython >= 3.0", "meson", "ninja"]
build-backend = "mesonpy"

[tool.uv]
package = true

[tool.meson-python.args]
install = ["--tags=python-module"]

[tool.mypy]
check_untyped_defs = true
follow_untyped_imports = true

[tool.pylint.main]
extension-pkg-allow-list = ["patricia26"]

